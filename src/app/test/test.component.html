<div>
    <h1>Smart Contract Interaction</h1>
  
    <!-- Display the message from the blockchain -->
    <p><strong>Message from contract:</strong></p>
    <p>{{ message }}</p>

    <button (click)="setMessage(5)">set Message</button>

  </div>
